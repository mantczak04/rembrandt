object:
  path: /absolute/path/to/model.obj
  up_axis: Z
  class_name: my_object
  class_id: 0
camera:
  n: 10
  azimuth_range:
  - 0.0
  - 360.0
  elevation_range:
  - -10.0
  - 30.0
  distance_range:
  - 3.0
  - 5.0
  strategy: random
  seed: 42
  look_at:
  - 0.0
  - 0.0
  - 0.0
lights:
- light_type: SUN
  location:
  - 2.0
  - -3.0
  - 5.0
  look_at:
  - 0.0
  - 0.0
  - 0.0
  energy: 3.0
  color:
  - 1.0
  - 1.0
  - 1.0
  size: 1.0
- light_type: POINT
  location:
  - -2.0
  - 2.0
  - 3.0
  look_at:
  - 1.0
  - 1.0
  - 1.0
  energy: null
  color:
  - 1.0
  - 1.0
  - 1.0
  size: 1.0
render:
  focal_length: 50.0
  resolution:
  - 640
  - 640
  engine: EEVEE
  samples: 32
output:
  dir: output
  train_val_split: 0.8
  split_seed: null
background:
  mode: none
  image_dir: null
  seed: null
  color:
  - 0.05
  - 0.05
  - 0.05
labels:
  enabled: true
  min_visible_pixels: 25
framing:
  center_jitter: 0.35
  fill_range:
  - 0.15
  - 0.75
  seed: null
# Optional: randomized photo backgrounds (default mode is none)
# background:
#   mode: image
#   image_dir: ./backgrounds
#   seed: 7
# Optional: per-frame randomized light rigs (default mode is static)
# light_randomization:
#   mode: random
#   count_range: [1, 3]
#   light_types: [POINT, SUN, AREA]
#   elevation_range: [10.0, 80.0]
#   energy_scale_range: [0.5, 2.0]
#   color_jitter: 0.15
#   seed: 7
